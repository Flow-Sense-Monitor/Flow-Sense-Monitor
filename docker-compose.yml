# FlowSense — sobe banco, backend e dashboard com:
#   cp .env.example .env   (e edite as senhas/chave)
#   docker compose up -d --build
#
# Pensado para uma VM Oracle Cloud Free Tier (ARM Ampere ou x86 com 1 GB de RAM):
# todas as imagens existem para amd64 e arm64, e cada serviço tem limite de memória.

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: flowsense
      MYSQL_USER: ${DB_USER:-flowsense}
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina DB_ROOT_PASSWORD no .env}
      TZ: UTC
    # Configuração para pouca memória (o padrão do MySQL reserva bem mais)
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --innodb-log-buffer-size=8M
      - --max-connections=20
      - --table-open-cache=200
      - --skip-name-resolve
    volumes:
      - mysql-dados:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: 400m
    # Porta só em 127.0.0.1: não fica aberta na internet. Para usar o MySQL Workbench,
    # conecte com "Standard TCP/IP over SSH" (túnel SSH até a VM). Ver README.
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"

  backend:
    build: ./flowsense-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/flowsense?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: ${DB_USER:-flowsense}
      DB_PASSWORD: ${DB_PASSWORD}
      MQTT_HOST: ${MQTT_HOST:-broker.hivemq.com}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TLS: ${MQTT_TLS:-false}
      FLOWSENSE_DISPOSITIVOS: ${FLOWSENSE_DISPOSITIVOS:-esp32-01}
      FLOWSENSE_API_KEY: ${FLOWSENSE_API_KEY:?defina FLOWSENSE_API_KEY no .env}
      FLOWSENSE_TARIFA_KWH: ${FLOWSENSE_TARIFA_KWH:-0.95}
      FLOWSENSE_CORS_ORIGENS: ${FLOWSENSE_CORS_ORIGENS:-http://localhost}
      FLOWSENSE_RETENCAO_DIAS: ${FLOWSENSE_RETENCAO_DIAS:-90}
      TZ: UTC
    # Só na própria VM (para testes com curl); o acesso externo passa pelo nginx do frontend.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    mem_limit: 400m

  frontend:
    build:
      context: ./flowsense-frontend
      args:
        VITE_API_URL: ""
        VITE_API_KEY: ${FLOWSENSE_API_KEY}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    mem_limit: 64m

volumes:
  mysql-dados:
